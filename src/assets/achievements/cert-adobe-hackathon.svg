      <stop offset="0%" stop-color="#240a12" />
      <stop offset="50%" stop-color="#14060c" />
      <stop offset="100%" stop-color="#080206" />
    </linearGradient>
    <linearGradient id="adobeBorder" x1="0%" y1="0%" x2="100%" y2="0%">

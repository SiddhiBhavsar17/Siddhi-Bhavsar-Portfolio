  </defs>

  <rect width="640" height="420" rx="16" fill="url(#adobeBg)" stroke="#3b151f" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="384" rx="12" fill="none" stroke="url(#adobeBorder)" stroke-width="1.6" opacity="0.7" />
  <rect x="26" y="26" width="588" height="368" rx="8" fill="none" stroke="#ef4444" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4" />

  <path d="M 28 50 L 28 28 L 50 28" stroke="#ef4444" stroke-width="2.5" fill="none" />
  <path d="M 612 50 L 612 28 L 590 28" stroke="#f97316" stroke-width="2.5" fill="none" />
  <path d="M 28 370 L 28 392 L 50 392" stroke="#a855f7" stroke-width="2.5" fill="none" />
  <path d="M 612 370 L 612 392 L 590 392" stroke="#ef4444" stroke-width="2.5" fill="none" />

  <!-- Badge: Qualified Round 2 -->

  </defs>

  <rect width="640" height="420" rx="16" fill="url(#ieeeBg)" stroke="#0e333d" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="384" rx="12" fill="none" stroke="url(#ieeeBorder)" stroke-width="1.6" opacity="0.7" />
  <rect x="26" y="26" width="588" height="368" rx="8" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4" />

  <path d="M 28 50 L 28 28 L 50 28" stroke="#06b6d4" stroke-width="2.5" fill="none" />
  <path d="M 612 50 L 612 28 L 590 28" stroke="#10b981" stroke-width="2.5" fill="none" />
  <path d="M 28 370 L 28 392 L 50 392" stroke="#3b82f6" stroke-width="2.5" fill="none" />
  <path d="M 612 370 L 612 392 L 590 392" stroke="#06b6d4" stroke-width="2.5" fill="none" />

  <!-- Badge: Finalist -->
  <g transform="translate(320, 75)">
    <rect x="-85" y="-22" width="170" height="30" rx="15" fill="#0c3038" stroke="#06b6d4" stroke-width="1.4" />

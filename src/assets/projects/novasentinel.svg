<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1c" />
      <stop offset="100%" stop-color="#02040c" />
    </linearGradient>
    <linearGradient id="nsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="nsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#nsBg)" />

  <!-- Radar Scan Circles -->
  <g transform="translate(400, 225)" opacity="0.35">
    <circle r="180" fill="none" stroke="#06b6d4" stroke-width="1" />
    <circle r="130" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="80" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <circle r="30" fill="none" stroke="#3b82f6" stroke-width="2" />
    <line x1="-190" y1="0" x2="190" y2="0" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="-190" x2="0" y2="190" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Radar sweep arc -->
    <path d="M 0 0 L 127 -127 A 180 180 0 0 1 180 0 Z" fill="#06b6d4" opacity="0.12" />
  </g>

  <!-- Bounding Box Targeting Reticles -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" filter="url(#nsGlow)">
    <!-- Target A -->
    <path d="M 220 130 L 210 130 L 210 140" />
    <path d="M 280 130 L 290 130 L 290 140" />
    <path d="M 210 180 L 210 190 L 220 190" />
    <path d="M 290 180 L 290 190 L 280 190" />
    <!-- Target B -->
    <path d="M 520 250 L 510 250 L 510 260" />
    <path d="M 580 250 L 590 250 L 590 260" />
    <path d="M 510 300 L 510 310 L 520 310" />
    <path d="M 590 300 L 590 310 L 580 310" />
  </g>

  <!-- Drone Silhouette & Detection Center -->
  <g transform="translate(400, 205)" filter="url(#nsGlow)">
    <!-- Drone Quadcopter Arms -->
    <line x1="-45" y1="-30" x2="45" y2="30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="-45" y1="30" x2="45" y2="-30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Rotors -->
    <circle cx="-45" cy="-30" r="14" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="45" cy="30" r="14" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="-45" cy="30" r="14" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="45" cy="-30" r="14" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 2" />
    <!-- Drone Body -->
    <circle cx="0" cy="0" r="16" fill="url(#nsCyan)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- HUD Text Overlay -->
  <rect x="250" y="325" width="300" height="75" rx="12" fill="#090e24" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="400" y="352" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    NOVASENTINEL
  </text>
  <text x="400" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#38bdf8" text-anchor="middle">
    AI-Powered Drone Surveillance & Detection
  </text>
  <text x="400" y="390" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">
    OPENCV • YOLO • REAL-TIME TELEMETRY
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c20" />
      <stop offset="100%" stop-color="#03050e" />
    </linearGradient>
    <linearGradient id="cpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="cpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#cpBg)" />

  <!-- Mini Dashboard Graphic UI Simulation -->
  <g transform="translate(180, 80)">
    <!-- Dashboard main container -->
    <rect width="440" height="230" rx="14" fill="#080e22" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3" filter="url(#cpGlow)" />
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="440" height="34" rx="14" fill="#0c1630" />
    <circle cx="20" cy="17" r="4" fill="#f43f5e" />
    <circle cx="34" cy="17" r="4" fill="#eab308" />
    <circle cx="48" cy="17" r="4" fill="#10b981" />
    <text x="75" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">
      campuspulse-intel-v2.0 // PCU_ANALYTICS
    </text>

    <!-- Metrics Cards inside -->
    <rect x="20" y="50" width="120" height="60" rx="8" fill="#101c38" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="32" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">CAMPUS DENSITY</text>
    <text x="32" y="94" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#34d399">94.2%</text>

    <rect x="160" y="50" width="120" height="60" rx="8" fill="#101c38" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="172" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">ACTIVE NODES</text>
    <text x="172" y="94" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#38bdf8">1,280</text>

    <rect x="300" y="50" width="120" height="60" rx="8" fill="#101c38" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="312" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">ANOMALIES</text>
    <text x="312" y="94" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#a78bfa">0 DETECTED</text>

    <!-- Trend Line Graph -->
    <path d="M 30 190 Q 90 140 160 170 T 280 130 T 410 160" fill="none" stroke="#10b981" stroke-width="2.5" />
    <circle cx="410" cy="160" r="4" fill="#34d399" />
  </g>

  <!-- Info Box -->
  <rect x="230" y="335" width="340" height="75" rx="12" fill="#090e24" fill-opacity="0.9" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
  <text x="400" y="362" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    CAMPUSPULSE AI
  </text>
  <text x="400" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#34d399" text-anchor="middle">
    Smart Campus Intelligence & Resource Allocation Dashboard
  </text>
  <text x="400" y="398" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">
    STREAMLIT • FASTAPI • PYTHON • SCIKIT-LEARN
  </text>
</svg>

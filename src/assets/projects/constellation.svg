<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12183a" />
      <stop offset="60%" stop-color="#070a1c" />
      <stop offset="100%" stop-color="#030510" />
    </radialGradient>
    <linearGradient id="nebulaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Night Sky Canvas -->
  <rect width="800" height="500" fill="url(#skyGlow)" />

  <!-- Digital Noise Denoising Grid / Processing Grid overlay -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" stroke-dasharray="4 6" />
    <line x1="250" y1="0" x2="250" y2="500" stroke-dasharray="4 6" />
    <line x1="400" y1="0" x2="400" y2="500" stroke-dasharray="4 6" />
    <line x1="550" y1="0" x2="550" y2="500" stroke-dasharray="4 6" />
    <line x1="700" y1="0" x2="700" y2="500" stroke-dasharray="4 6" />
    <line x1="0" y1="120" x2="800" y2="120" stroke-dasharray="4 6" />
    <line x1="0" y1="250" x2="800" y2="250" stroke-dasharray="4 6" />
    <line x1="0" y1="380" x2="800" y2="380" stroke-dasharray="4 6" />
  </g>

  <!-- Nebula Cloud Accent -->
  <ellipse cx="420" cy="240" rx="260" ry="160" fill="url(#nebulaGrad)" filter="url(#starGlow)" />

  <!-- Constellation Lines (Ursa Major / Orion Style Geometric Geometry) -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.75" stroke-dasharray="6 4">
    <!-- Star Group A (Major Constellation) -->
    <line x1="220" y1="160" x2="340" y2="130" />
    <line x1="340" y1="130" x2="430" y2="210" />
    <line x1="430" y1="210" x2="550" y2="180" />
    <line x1="550" y1="180" x2="620" y2="290" />
    <line x1="430" y1="210" x2="410" y2="340" />
    <line x1="410" y1="340" x2="290" y2="360" />
    <line x1="290" y1="360" x2="220" y2="160" />
    <line x1="550" y1="180" x2="480" y2="330" />
  </g>

  <!-- Bright Stars (Glowing Nodes) -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <circle cx="220" cy="160" r="5" fill="#bae6fd" />
    <circle cx="340" cy="130" r="4.5" fill="#e0f2fe" />
    <circle cx="430" cy="210" r="7" fill="#f0f9ff" />
    <circle cx="550" cy="180" r="6" fill="#7dd3fc" />
    <circle cx="620" cy="290" r="5" fill="#bae6fd" />
    <circle cx="410" cy="340" r="5.5" fill="#e0e7ff" />
    <circle cx="290" cy="360" r="4.5" fill="#fbcfe8" />
    <circle cx="480" cy="330" r="5" fill="#38bdf8" />
  </g>

  <!-- Ambient Micro Stars -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="160" cy="240" r="1" />
    <circle cx="280" cy="70" r="2" />
    <circle cx="490" cy="90" r="1.5" />
    <circle cx="680" cy="140" r="2" />
    <circle cx="730" cy="230" r="1" />
    <circle cx="670" cy="390" r="2.5" />
    <circle cx="180" cy="420" r="1.5" />
    <circle cx="360" cy="440" r="1" />
    <circle cx="580" cy="420" r="2" />
    <circle cx="750" cy="80" r="1.5" />
    <circle cx="90" cy="340" r="1.5" />
  </g>

  <!-- Image Processing Scanner Reticle -->
  <g stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.8">
    <circle cx="430" cy="210" r="24" stroke-dasharray="3 3" />
    <line x1="430" y1="175" x2="430" y2="192" />
    <line x1="430" y1="228" x2="430" y2="245" />
    <line x1="395" y1="210" x2="412" y2="210" />
    <line x1="448" y1="210" x2="465" y2="210" />
  </g>

  <!-- Score / Interactive Game HUD Overlay Badge -->
  <rect x="580" y="30" width="180" height="42" rx="8" fill="#0b132e" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
  <text x="600" y="56" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">SCORE: 9,840</text>
  <circle cx="735" cy="51" r="5" fill="#4ade80" />

  <!-- Denoise Filter Label -->
  <rect x="40" y="30" width="220" height="34" rx="6" fill="#080e22" stroke="#818cf8" stroke-width="1" opacity="0.85" />
  <text x="56" y="52" fill="#a5b4fc" font-family="monospace" font-size="12">✦ DIP: NOISE REDUCED</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="slBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a22" />
      <stop offset="100%" stop-color="#040510" />
    </linearGradient>
    <linearGradient id="slViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="slGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#slBg)" />

  <!-- Hand Landmark Graph / Skeleton representation -->
  <g transform="translate(400, 190)" stroke="#a855f7" stroke-width="2" fill="none" filter="url(#slGlow)">
    <!-- Palm base -->
    <path d="M 0 100 L -30 60 L -45 10 L -40 -40" />
    <path d="M 0 100 L -10 45 L -15 -10 L -15 -60" />
    <path d="M 0 100 L 15 45 L 15 -15 L 15 -65" />
    <path d="M 0 100 L 40 50 L 45 0 L 45 -45" />
    <path d="M 0 100 L -45 80 L -70 40 L -80 0" />

    <!-- Joint Cross-connects -->
    <line x1="-30" y1="60" x2="-10" y2="45" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-10" y1="45" x2="15" y2="45" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="15" y1="45" x2="40" y2="50" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Landmark Points -->
    <circle cx="0" cy="100" r="5" fill="#38bdf8" />
    <circle cx="-30" cy="60" r="4" fill="#a855f7" />
    <circle cx="-45" cy="10" r="4" fill="#a855f7" />
    <circle cx="-40" cy="-40" r="5" fill="#f43f5e" />

    <circle cx="-10" cy="45" r="4" fill="#a855f7" />
    <circle cx="-15" cy="-10" r="4" fill="#a855f7" />
    <circle cx="-15" cy="-60" r="5" fill="#f43f5e" />

    <circle cx="15" cy="45" r="4" fill="#a855f7" />
    <circle cx="15" cy="-15" r="4" fill="#a855f7" />
    <circle cx="15" cy="-65" r="5" fill="#f43f5e" />

    <circle cx="40" cy="50" r="4" fill="#a855f7" />
    <circle cx="45" cy="0" r="4" fill="#a855f7" />
    <circle cx="45" cy="-45" r="5" fill="#f43f5e" />

    <circle cx="-45" cy="80" r="4" fill="#a855f7" />
    <circle cx="-70" cy="40" r="4" fill="#a855f7" />
    <circle cx="-80" cy="0" r="5" fill="#f43f5e" />
  </g>

  <!-- Neural translation wave -->
  <path d="M 100 200 Q 250 120 400 200 T 700 200" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Info Box -->
  <rect x="230" y="325" width="340" height="80" rx="12" fill="#0c0e25" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" />
  <text x="400" y="352" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    SIGN LANGUAGE TRANSLATOR
  </text>
  <text x="400" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#c084fc" text-anchor="middle">
    AI-Based Sign Language Translation & NLP Pipeline
  </text>
  <text x="400" y="390" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">
    MEDIAPIPE • OPENCV • PYTORCH • SEQUENCE MODEL
  </text>
</svg>

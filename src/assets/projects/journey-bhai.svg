<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="jbBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08102b" />
      <stop offset="50%" stop-color="#0a1a3a" />
      <stop offset="100%" stop-color="#050818" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="jbGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#jbBgGrad)" />

  <!-- Digital Grid Map Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Global Route Trajectory (Curved flight paths) -->
  <path d="M120 320 Q 400 80 680 260" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.6" />
  <path d="M180 360 Q 450 150 720 180" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Route Nodes -->
  <circle cx="120" cy="320" r="8" fill="#06b6d4" filter="url(#jbGlow2)" />
  <circle cx="400" cy="180" r="10" fill="#3b82f6" filter="url(#jbGlow2)" />
  <circle cx="680" cy="260" r="8" fill="#a855f7" filter="url(#jbGlow2)" />

  <!-- Center Card Badge / HUD -->
  <g transform="translate(250, 115)">
    <rect width="300" height="220" rx="20" fill="#080d24" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" filter="url(#jbGlow2)" />
    
    <!-- Paper Plane Icon -->
    <polygon points="150,45 190,115 150,100 110,115" fill="url(#cyanPurple)" />
    
    <text x="150" y="150" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      JOURNEY BHAI
    </text>
    <text x="150" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#38bdf8" text-anchor="middle">
      AI-Powered Smart Travel Companion
    </text>

    <rect x="50" y="190" width="200" height="22" rx="11" fill="#0e1838" stroke="#38bdf8" stroke-opacity="0.3" />
    <text x="150" y="205" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">
      GENAI • ITINERARY • AGENTS
    </text>
  </g>

  <!-- HUD Status Elements -->
  <text x="40" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" opacity="0.7">
    [SYS_AI] ROUTE_OPTIMIZER :: ACTIVE
  </text>
  <text x="760" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a855f7" opacity="0.7" text-anchor="end">
    LAT_LON_COORDS :: GENERATIVE_AGENT
  </text>
</svg>

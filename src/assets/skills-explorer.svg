<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <!-- Sky glow -->
    <radialGradient id="spaceGlow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient space background glow -->
  <rect width="500" height="240" fill="url(#spaceGlow)" />

  <!-- Constellation and Orbital Rings (Left side) -->
  <g transform="translate(100, 70)" opacity="0.65">
    <ellipse cx="0" cy="0" rx="60" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" transform="rotate(-25)" />
    <circle cx="0" cy="0" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" fill="#38bdf8" opacity="0.8" />
    <line x1="20" y1="-30" x2="65" y2="-45" stroke="#818cf8" stroke-width="1" />
    <circle cx="65" cy="-45" r="2.5" fill="#f472b6" />
    <line x1="65" y1="-45" x2="110" y2="-20" stroke="#818cf8" stroke-width="1" />
    <circle cx="110" cy="-20" r="3" fill="#38bdf8" />
  </g>

  <!-- Twinkling Starlight -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="40" cy="40" r="1.5" />
    <circle cx="70" cy="180" r="2" fill="#38bdf8" />
    <circle cx="200" cy="30" r="1.5" />
    <circle cx="340" cy="45" r="2.5" fill="#fde047" />
    <circle cx="380" cy="190" r="1.5" />
    <polygon points="270,160 272,166 278,166 273,170 275,176 270,172 265,176 267,170 262,166 268,166" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Handwritten Quote (Center-Left) -->
  <g transform="translate(240, 110)">
    <text x="0" y="0" fill="#e2e8f0" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" letter-spacing="0.5">Still learning.</text>
    <text x="0" y="36" fill="#f8fafc" font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="bold" letter-spacing="0.5">Always exploring.</text>
    <text x="0" y="70" fill="#38bdf8" font-family="'Caveat', cursive, sans-serif" font-size="22" font-style="italic">That&apos;s the fun part.</text>
  </g>

  <!-- Mini Astronaut / Stargazer (Right side) -->
  <g transform="translate(420, 150)">
    <!-- Little Stargazer looking up at sky -->
    <ellipse cx="15" cy="55" rx="24" ry="10" fill="#090d24" />
    <!-- Body in space suit -->
    <path d="M 0 50 C 0 25, 25 25, 25 50 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <!-- Helmet with reflective visor -->
    <circle cx="12" cy="15" r="18" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <ellipse cx="16" cy="14" rx="10" ry="11" fill="#38bdf8" opacity="0.8" />
    <circle cx="19" cy="10" r="3" fill="#ffffff" />
    <!-- Backpack -->
    <rect x="-10" y="20" width="10" height="24" rx="4" fill="#0f172a" />
  </g>
</svg>

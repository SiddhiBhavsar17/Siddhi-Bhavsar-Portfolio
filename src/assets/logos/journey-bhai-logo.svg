<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- ======================================================================== -->
  <!-- JOURNEY BHAI LOGO PLACEHOLDER                                            -->
  <!-- You can replace this file directly with your actual logo (SVG, PNG, JPG) -->
  <!-- or update the path in src/data/projects.ts                               -->
  <!-- ======================================================================== -->
  <defs>
    <linearGradient id="jbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="jbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e28" />
      <stop offset="100%" stop-color="#040614" />
    </linearGradient>
    <filter id="jbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" rx="36" fill="url(#jbBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Compass / Flight Route Coordinates Orbit -->
  <circle cx="150" cy="130" r="75" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />
  <circle cx="150" cy="130" r="50" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5" />

  <!-- Stylized AI Paper Plane / Flight Compass Glyph -->
  <g filter="url(#jbGlow)">
    <polygon points="150,70 195,155 150,140 105,155" fill="url(#jbGrad)" />
    <polygon points="150,70 150,140 105,155" fill="#38bdf8" opacity="0.75" />
    <!-- AI Core Pulse -->
    <circle cx="150" cy="130" r="5" fill="#ffffff" />
  </g>

  <!-- Star points -->
  <circle cx="80" cy="80" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="220" cy="75" r="2.5" fill="#a855f7" opacity="0.8" />
  <circle cx="70" cy="180" r="1.5" fill="#38bdf8" opacity="0.5" />
  <circle cx="230" cy="170" r="2" fill="#38bdf8" opacity="0.7" />

  <!-- Typography -->
  <text x="150" y="215" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    JOURNEY BHAI
  </text>
  <text x="150" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    AI TRAVEL COMPANION
  </text>
  <rect x="70" y="260" width="160" height="20" rx="10" fill="#0c1333" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="150" y="274" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">
    [REPLACE WITH OFFICIAL LOGO]
  </text>
</svg>

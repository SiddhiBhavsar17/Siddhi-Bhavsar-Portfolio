<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background sky gradient -->
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Warm horizon / castle glow -->
    <radialGradient id="cityGlow" cx="50%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Outer neon ring gradient (Cyan to Purple/Pink) -->
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Girl Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b36" />
      <stop offset="50%" stop-color="#181124" />
      <stop offset="100%" stop-color="#0b0814" />
    </linearGradient>

    <!-- Sweater Gradient -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="215" />
    </clipPath>
  </defs>

  <!-- Masked Celestial City & Explorer Illustration -->
  <g clip-path="url(#circleClip)">
    <!-- Cosmic Twilight Sky -->
    <rect width="500" height="500" fill="url(#skyGrad)" />

    <!-- Distant Nebula Cloud -->
    <ellipse cx="280" cy="180" rx="190" ry="110" fill="#6366f1" opacity="0.18" />
    <ellipse cx="180" cy="220" rx="140" ry="90" fill="#ec4899" opacity="0.12" />

    <!-- Stars Field -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="90" cy="110" r="1.5" />
      <circle cx="140" cy="80" r="2" />
      <circle cx="210" cy="65" r="1.5" />
      <circle cx="290" cy="85" r="2.5" />
      <circle cx="360" cy="120" r="1.5" />
      <circle cx="410" cy="95" r="2" />
      <circle cx="160" cy="160" r="1.2" />
      <circle cx="340" cy="170" r="1.8" />
      <circle cx="390" cy="210" r="1.5" />
      <circle cx="80" cy="220" r="2" />
      <circle cx="250" cy="115" r="3" fill="#38bdf8" />
      <polygon points="250,105 253,115 263,115 255,121 258,131 250,125 242,131 245,121 237,115 247,115" fill="#fde047" opacity="0.85" transform="scale(0.5) translate(250, 100)" />
    </g>

    <!-- Warm Horizon Glow -->
    <rect y="200" width="500" height="300" fill="url(#cityGlow)" />

    <!-- Distant Castle & Spire Silhouettes -->
    <g fill="#0b0f19" opacity="0.85">
      <!-- Left Spires -->
      <polygon points="70,360 85,240 100,360" />
      <rect x="75" y="270" width="20" height="90" />
      <polygon points="110,360 120,270 130,360" />

      <!-- Center-Right Fairy Tale Citadel & Spires -->
      <polygon points="340,360 360,200 380,360" />
      <polygon points="385,360 395,230 405,360" />
      <polygon points="290,360 310,220 330,360" />
      <rect x="300" y="250" width="80" height="110" rx="4" />
      
      <!-- Arched castle windows with warm light -->
      <rect x="315" y="270" width="8" height="14" rx="4" fill="#fbbf24" opacity="0.9" />
      <rect x="335" y="270" width="8" height="14" rx="4" fill="#fbbf24" opacity="0.9" />
      <rect x="355" y="270" width="8" height="14" rx="4" fill="#fbbf24" opacity="0.9" />
      <rect x="325" y="300" width="10" height="18" rx="5" fill="#fbbf24" opacity="0.9" />
      <rect x="348" y="300" width="10" height="18" rx="5" fill="#fbbf24" opacity="0.9" />
    </g>

    <!-- Atmospheric Fog -->
    <path d="M0 380 Q 150 350, 300 370 T 500 360 L 500 500 L 0 500 Z" fill="#030712" opacity="0.9" />

    <!-- Explorer (Girl with dark ponytail and ribbon looking out toward the castle) -->
    <g id="figure">
      <!-- Cozy Dark Sweater (Shoulders & Back) -->
      <path d="M120 500 C130 430, 170 380, 250 380 C330 380, 370 430, 380 500 Z" fill="url(#sweaterGrad)" />

      <!-- Collar detail -->
      <path d="M215 385 C230 395, 270 395, 285 385" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round" />

      <!-- Head & Hair from behind -->
      <ellipse cx="250" cy="275" rx="65" ry="75" fill="url(#hairGrad)" />

      <!-- Low Ponytail Cascade -->
      <path d="M240 330 Q 250 420, 260 445 Q 240 420, 235 340 Z" fill="#140d1e" />

      <!-- Soft White / Cream Hair Ribbon / Bow (Matching reference image) -->
      <g id="ribbon" fill="#f8fafc" opacity="0.95">
        <!-- Center knot -->
        <circle cx="248" cy="318" r="7" fill="#e2e8f0" />
        <!-- Left loop -->
        <ellipse cx="230" cy="315" rx="14" ry="9" transform="rotate(-15 230 315)" />
        <!-- Right loop -->
        <ellipse cx="266" cy="315" rx="14" ry="9" transform="rotate(15 266 315)" />
        <!-- Ribbon tails -->
        <path d="M243 322 Q 235 350, 230 375 L 238 368 Q 246 345, 247 325 Z" />
        <path d="M253 322 Q 260 350, 268 375 L 260 368 Q 254 345, 251 325 Z" />
      </g>
    </g>
  </g>

  <!-- Glowing Neon Outer Rings -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#neonRing)" stroke-width="4" filter="url(#softGlow)" opacity="0.9" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
</svg>

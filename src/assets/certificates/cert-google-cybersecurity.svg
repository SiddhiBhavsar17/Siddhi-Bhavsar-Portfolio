<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c24" />
      <stop offset="50%" stop-color="#0a0818" />
      <stop offset="100%" stop-color="#04030a" />
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="16" fill="url(#cyberBg)" stroke="#261b40" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="384" rx="12" fill="none" stroke="url(#cyberBorder)" stroke-width="1.6" opacity="0.65" />
  <rect x="26" y="26" width="588" height="368" rx="8" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4" />

  <path d="M 28 50 L 28 28 L 50 28" stroke="#a855f7" stroke-width="2.5" fill="none" />
  <path d="M 612 50 L 612 28 L 590 28" stroke="#ec4899" stroke-width="2.5" fill="none" />
  <path d="M 28 370 L 28 392 L 50 392" stroke="#8b5cf6" stroke-width="2.5" fill="none" />
  <path d="M 612 370 L 612 392 L 590 392" stroke="#c084fc" stroke-width="2.5" fill="none" />

  <!-- Badge: Google on Coursera -->
  <g transform="translate(320, 75)">
    <rect x="-115" y="-22" width="230" height="30" rx="15" fill="#1b1236" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="0" y="-3" font-family="sans-serif" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle" letter-spacing="2">
      GOOGLE • 9-COURSE PROGRAM
    </text>
  </g>

  <text x="320" y="125" font-family="monospace" font-size="11" fill="#c084fc" text-anchor="middle" letter-spacing="3" font-weight="600">
    PROFESSIONAL CERTIFICATE
  </text>

  <text x="320" y="165" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    Google Cybersecurity
  </text>
  <text x="320" y="195" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#c084fc" text-anchor="middle">
    Professional Certificate
  </text>

  <text x="320" y="240" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Authorized by Google and offered through Coursera
  </text>

  <line x1="160" y1="262" x2="480" y2="262" stroke="#2e1065" stroke-width="1" />

  <g transform="translate(100, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">ORGANIZATION</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Google</text>
  </g>

  <g transform="translate(280, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">PLATFORM</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Coursera</text>
  </g>

  <g transform="translate(460, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">CURRICULUM</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc">9 Courses</text>
  </g>

  <!-- Seal -->
  <g transform="translate(320, 360)">
    <circle r="22" fill="#180e30" stroke="#8b5cf6" stroke-width="1.8" />
    <circle r="18" fill="none" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="3 2" />
    <polygon points="0,-10 6,7 -9,-3 9,-3 -6,7" fill="#c084fc" />
  </g>
</svg>

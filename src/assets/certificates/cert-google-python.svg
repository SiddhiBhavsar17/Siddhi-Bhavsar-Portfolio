<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="googleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071917" />
      <stop offset="50%" stop-color="#051010" />
      <stop offset="100%" stop-color="#020808" />
    </linearGradient>
    <linearGradient id="googleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="16" fill="url(#googleBg)" stroke="#0f3028" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="384" rx="12" fill="none" stroke="url(#googleBorder)" stroke-width="1.6" opacity="0.65" />
  <rect x="26" y="26" width="588" height="368" rx="8" fill="none" stroke="#34d399" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4" />

  <path d="M 28 50 L 28 28 L 50 28" stroke="#34d399" stroke-width="2.5" fill="none" />
  <path d="M 612 50 L 612 28 L 590 28" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <path d="M 28 370 L 28 392 L 50 392" stroke="#059669" stroke-width="2.5" fill="none" />
  <path d="M 612 370 L 612 392 L 590 392" stroke="#10b981" stroke-width="2.5" fill="none" />

  <!-- Badge: Google on Coursera -->
  <g transform="translate(320, 75)">
    <rect x="-105" y="-22" width="210" height="30" rx="15" fill="#0b241e" stroke="#10b981" stroke-width="1.2" />
    <text x="0" y="-3" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">
      GOOGLE • COURSERA
    </text>
  </g>

  <text x="320" y="125" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle" letter-spacing="3" font-weight="600">
    COURSE CERTIFICATE
  </text>

  <text x="320" y="175" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">
    Crash Course on Python
  </text>

  <text x="320" y="230" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Authorized by Google and offered through Coursera
  </text>

  <line x1="160" y1="262" x2="480" y2="262" stroke="#134e4a" stroke-width="1" />

  <g transform="translate(100, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">ORGANIZATION</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Google</text>
  </g>

  <g transform="translate(280, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">PLATFORM</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Coursera</text>
  </g>

  <g transform="translate(460, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">LANGUAGE</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">Python</text>
  </g>

  <!-- Seal -->
  <g transform="translate(320, 360)">
    <circle r="22" fill="#08221b" stroke="#10b981" stroke-width="1.8" />
    <circle r="18" fill="none" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3 2" />
    <polygon points="0,-10 6,7 -9,-3 9,-3 -6,7" fill="#34d399" />
  </g>
</svg>

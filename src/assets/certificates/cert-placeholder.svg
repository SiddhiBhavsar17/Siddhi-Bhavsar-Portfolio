<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1028" />
      <stop offset="100%" stop-color="#040614" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#certBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="16" y="16" width="568" height="368" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Ornate corner ticks -->
  <path d="M 24 40 L 24 24 L 40 24" stroke="#38bdf8" stroke-width="2" fill="none" />
  <path d="M 576 40 L 576 24 L 560 24" stroke="#38bdf8" stroke-width="2" fill="none" />
  <path d="M 24 360 L 24 376 L 40 376" stroke="#818cf8" stroke-width="2" fill="none" />
  <path d="M 576 360 L 576 376 L 560 376" stroke="#818cf8" stroke-width="2" fill="none" />

  <!-- Seal Emblem -->
  <g transform="translate(300, 110)">
    <circle r="42" fill="#0c1638" stroke="#38bdf8" stroke-width="2" />
    <circle r="34" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 3" />
    <polygon points="0,-18 12,14 -18,-6 18,-6 -12,14" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Title Text -->
  <text x="300" y="195" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">

  </text>
  <text x="300" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Issued to Siddhi Bhavsar
  </text>
  
  <line x1="200" y1="285" x2="400" y2="285" stroke="#334155" stroke-width="1" />

  <text x="300" y="325" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle">
    [CERTIFICATE THUMBNAIL PLACEHOLDER]
  </text>
  <text x="300" y="345" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle" opacity="0.8">
    REPLACE VIA SRC/ASSETS/CERTIFICATES/
  </text>

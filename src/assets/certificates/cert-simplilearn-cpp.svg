<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2e" />
      <stop offset="50%" stop-color="#05101f" />
      <stop offset="100%" stop-color="#030811" />
    </linearGradient>
    <linearGradient id="cppBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="16" fill="url(#cppBg)" stroke="#0e2a47" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="384" rx="12" fill="none" stroke="url(#cppBorder)" stroke-width="1.6" opacity="0.65" />
  <rect x="26" y="26" width="588" height="368" rx="8" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4" />

  <path d="M 28 50 L 28 28 L 50 28" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <path d="M 612 50 L 612 28 L 590 28" stroke="#6366f1" stroke-width="2.5" fill="none" />
  <path d="M 28 370 L 28 392 L 50 392" stroke="#0284c7" stroke-width="2.5" fill="none" />
  <path d="M 612 370 L 612 392 L 590 392" stroke="#38bdf8" stroke-width="2.5" fill="none" />

  <!-- Badge: Simplilearn / Coursera -->
  <g transform="translate(320, 75)">
    <rect x="-115" y="-22" width="230" height="30" rx="15" fill="#0d243f" stroke="#0284c7" stroke-width="1.2" />
    <text x="0" y="-3" font-family="sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">
      SIMPLILEARN • COURSERA
    </text>
  </g>

  <text x="320" y="125" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="3" font-weight="600">
    COURSE CERTIFICATE
  </text>

  <text x="320" y="175" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">
    Programming with C++
  </text>

  <text x="320" y="230" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Offered by Simplilearn through Coursera
  </text>

  <line x1="160" y1="262" x2="480" y2="262" stroke="#16395b" stroke-width="1" />

  <g transform="translate(100, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">ORGANIZATION</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Simplilearn</text>
  </g>

  <g transform="translate(280, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">PLATFORM</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Coursera</text>
  </g>

  <g transform="translate(460, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">LANGUAGE</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">C++</text>
  </g>

  <!-- Seal -->
  <g transform="translate(320, 360)">
    <circle r="22" fill="#091b30" stroke="#0284c7" stroke-width="1.8" />
    <circle r="18" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 2" />
    <polygon points="0,-10 6,7 -9,-3 9,-3 -6,7" fill="#38bdf8" />
  </g>
</svg>

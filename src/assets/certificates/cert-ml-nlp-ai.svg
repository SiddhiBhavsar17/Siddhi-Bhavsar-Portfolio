<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081026" />
      <stop offset="50%" stop-color="#060c1d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="mlBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="16" fill="url(#mlBg)" stroke="#16203a" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="384" rx="12" fill="none" stroke="url(#mlBorder)" stroke-width="1.6" opacity="0.65" />
  <rect x="26" y="26" width="588" height="368" rx="8" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4" />

  <!-- Corner Ornamental Ticks -->
  <path d="M 28 50 L 28 28 L 50 28" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <path d="M 612 50 L 612 28 L 590 28" stroke="#0ea5e9" stroke-width="2.5" fill="none" />
  <path d="M 28 370 L 28 392 L 50 392" stroke="#06b6d4" stroke-width="2.5" fill="none" />
  <path d="M 612 370 L 612 392 L 590 392" stroke="#60a5fa" stroke-width="2.5" fill="none" />

  <!-- Header Badge -->
  <g transform="translate(320, 75)">
    <rect x="-105" y="-22" width="210" height="30" rx="15" fill="#0d1f3f" stroke="#0284c7" stroke-width="1.2" />
    <text x="0" y="-3" font-family="sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">
      MACHINE LEARNING &amp; NLP
    </text>
  </g>

  <text x="320" y="125" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="3" font-weight="600">
    SPECIALIZATION CERTIFICATE
  </text>

  <text x="320" y="165" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    Machine Learning, NLP &amp; Deep Learning
  </text>
  <text x="320" y="195" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" text-anchor="middle">
    Artificial Intelligence &amp; Neural Architectures
  </text>

  <text x="320" y="240" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Covers Supervised &amp; Unsupervised Models, Natural Language Processing, and Transformers
  </text>

  <line x1="160" y1="262" x2="480" y2="262" stroke="#1e293b" stroke-width="1" />

  <g transform="translate(100, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">DOMAINS</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">ML / NLP / AI</text>
  </g>

  <g transform="translate(280, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">FOCUS</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Deep Learning</text>
  </g>

  <g transform="translate(460, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">STATUS</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">COMPLETED</text>
  </g>

  <!-- Seal -->
  <g transform="translate(320, 360)">
    <circle r="22" fill="#081830" stroke="#0284c7" stroke-width="1.8" />
    <circle r="18" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 2" />
    <polygon points="0,-10 6,7 -9,-3 9,-3 -6,7" fill="#38bdf8" />
  </g>
</svg>

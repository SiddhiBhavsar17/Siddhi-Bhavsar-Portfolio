<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="udemyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100b24" />
      <stop offset="50%" stop-color="#0a0e28" />
      <stop offset="100%" stop-color="#050818" />
    </linearGradient>
    <linearGradient id="udemyBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="420" rx="16" fill="url(#udemyBg)" stroke="#1e223d" stroke-width="2"/>
  
  <!-- Outer Ornate Guilloche Border Frame -->
  <rect x="18" y="18" width="604" height="384" rx="12" fill="none" stroke="url(#udemyBorder)" stroke-width="1.6" opacity="0.65" />
  <rect x="26" y="26" width="588" height="368" rx="8" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4" />

  <!-- Corner Ornamental Ticks -->
  <path d="M 28 50 L 28 28 L 50 28" stroke="#ec4899" stroke-width="2.5" fill="none" />
  <path d="M 612 50 L 612 28 L 590 28" stroke="#a855f7" stroke-width="2.5" fill="none" />
  <path d="M 28 370 L 28 392 L 50 392" stroke="#06b6d4" stroke-width="2.5" fill="none" />
  <path d="M 612 370 L 612 392 L 590 392" stroke="#3b82f6" stroke-width="2.5" fill="none" />

  <!-- Header Header Ribbon -->
  <g transform="translate(320, 75)">
    <!-- Brand badge -->
    <rect x="-90" y="-22" width="180" height="30" rx="15" fill="#181339" stroke="#a855f7" stroke-width="1.2" />
    <text x="0" y="-3" font-family="sans-serif" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle" letter-spacing="2">
      UDEMY • 365 CAREERS
    </text>
  </g>

  <!-- Certificate Subtitle -->
  <text x="320" y="125" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="3" font-weight="600">
    CERTIFICATE OF COMPLETION
  </text>

  <!-- Main Certificate Title -->
  <text x="320" y="165" font-family="'Space Grotesk', system-ui, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">
    AI Engineer Course
  </text>
  <text x="320" y="195" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#c084fc" text-anchor="middle">
    Complete AI Engineer Bootcamp
  </text>

  <!-- Issued Recipient Line -->
  <text x="320" y="240" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    This credential validates comprehensive mastery of Artificial Intelligence Engineering
  </text>
  
  <line x1="160" y1="262" x2="480" y2="262" stroke="#334155" stroke-width="1" />

  <!-- Instructors / Details Block -->
  <g transform="translate(100, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">INSTRUCTOR</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">365 Careers</text>
  </g>

  <g transform="translate(270, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">PLATFORM</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Udemy</text>
  </g>

  <g transform="translate(440, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">YEAR ISSUED</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">2026</text>
  </g>

  <!-- Official Seal -->
  <g transform="translate(320, 360)">
    <circle r="22" fill="#141133" stroke="url(#purpleGold)" stroke-width="1.8" />
    <circle r="18" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 2" />
    <polygon points="0,-10 6,7 -9,-3 9,-3 -6,7" fill="#fbbf24" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="metaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07172c" />
      <stop offset="50%" stop-color="#050e1b" />
      <stop offset="100%" stop-color="#02070e" />
    </linearGradient>
    <linearGradient id="metaBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0081fb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="16" fill="url(#metaBg)" stroke="#0c2340" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="384" rx="12" fill="none" stroke="url(#metaBorder)" stroke-width="1.6" opacity="0.65" />
  <rect x="26" y="26" width="588" height="368" rx="8" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 4" />

  <path d="M 28 50 L 28 28 L 50 28" stroke="#0081fb" stroke-width="2.5" fill="none" />
  <path d="M 612 50 L 612 28 L 590 28" stroke="#06b6d4" stroke-width="2.5" fill="none" />
  <path d="M 28 370 L 28 392 L 50 392" stroke="#10b981" stroke-width="2.5" fill="none" />
  <path d="M 612 370 L 612 392 L 590 392" stroke="#38bdf8" stroke-width="2.5" fill="none" />

  <!-- Badge: Meta on Coursera -->
  <g transform="translate(320, 75)">
    <rect x="-95" y="-22" width="190" height="30" rx="15" fill="#0c1f3a" stroke="#0081fb" stroke-width="1.2" />
    <text x="0" y="-3" font-family="sans-serif" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="2">
      META • COURSERA
    </text>
  </g>

  <text x="320" y="125" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="3" font-weight="600">
    COURSE CERTIFICATE
  </text>

  <text x="320" y="175" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">
    Django Framework
  </text>

  <text x="320" y="230" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Authorized by Meta and offered through Coursera
  </text>

  <line x1="160" y1="262" x2="480" y2="262" stroke="#163558" stroke-width="1" />

  <g transform="translate(100, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">ORGANIZATION</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Meta</text>
  </g>

  <g transform="translate(280, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">PLATFORM</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Coursera</text>
  </g>

  <g transform="translate(460, 290)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" text-transform="uppercase">BACKEND</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Django</text>
  </g>

  <!-- Seal -->
  <g transform="translate(320, 360)">
    <circle r="22" fill="#081a33" stroke="#0081fb" stroke-width="1.8" />
    <circle r="18" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 2" />
    <polygon points="0,-10 6,7 -9,-3 9,-3 -6,7" fill="#0081fb" />
  </g>
</svg>

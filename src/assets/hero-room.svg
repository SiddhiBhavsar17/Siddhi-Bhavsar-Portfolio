<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Background wall & window gradients -->
    <radialGradient id="windowGlow" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d24" />
    </radialGradient>

    <!-- Warm lantern / desk glow -->
    <radialGradient id="lampGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090d24" stop-opacity="0" />
    </radialGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Atmospheric Background Ambient Glow -->
  <rect width="600" height="500" fill="#070b1f" rx="16" />
  <rect x="180" y="20" width="400" height="460" fill="url(#lampGlow)" />

  <!-- Arched Gothic Window (Looking into Starry Citadel) -->
  <g transform="translate(260, 20)">
    <!-- Arch Frame Outer -->
    <path d="M 40 400 L 40 160 C 40 60, 160 0, 160 0 C 160 0, 280 60, 280 160 L 280 400 Z" fill="#090e28" stroke="#312e81" stroke-width="6" />
    <!-- Window Sky Pane -->
    <path d="M 46 394 L 46 162 C 46 70, 160 10, 160 10 C 160 10, 274 70, 274 162 L 274 394 Z" fill="url(#windowGlow)" />

    <!-- Distant Castle Spires seen through window -->
    <polygon points="120,380 135,210 150,380" fill="#090d26" opacity="0.9" />
    <polygon points="170,380 190,170 210,380" fill="#0a0f2e" opacity="0.95" />
    <polygon points="215,380 225,240 235,380" fill="#090d26" opacity="0.9" />
    <!-- Lit Castle Windows -->
    <circle cx="190" cy="230" r="3" fill="#fef08a" opacity="0.8" />
    <circle cx="190" cy="250" r="3" fill="#fef08a" opacity="0.8" />
    <circle cx="140" cy="260" r="2.5" fill="#fde047" opacity="0.8" />
    <circle cx="140" cy="280" r="2.5" fill="#fde047" opacity="0.8" />

    <!-- Window Tracery / Mullions -->
    <line x1="160" y1="10" x2="160" y2="394" stroke="#1e1b4b" stroke-width="4" />
    <line x1="46" y1="210" x2="274" y2="210" stroke="#1e1b4b" stroke-width="3" />
    <!-- Gothic curves -->
    <path d="M 46 162 C 90 190, 120 180, 160 210 C 200 180, 230 190, 274 162" fill="none" stroke="#1e1b4b" stroke-width="3" />

    <!-- Warm lantern hanging by window -->
    <line x1="65" y1="180" x2="65" y2="230" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="65" cy="240" r="10" fill="#fef08a" filter="url(#glow)" opacity="0.9" />
    <rect x="58" y="232" width="14" height="16" rx="2" fill="none" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- Floating Sticky Note (Top Right) -->
  <g transform="translate(430, 45) rotate(4)">
    <rect width="145" height="110" rx="4" fill="#312244" stroke="#c084fc" stroke-width="1" opacity="0.9" />
    <text x="72" y="25" fill="#fbcfe8" font-family="'Caveat', cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SOMEWHERE</text>
    <text x="72" y="42" fill="#fbcfe8" font-family="'Caveat', cursive, sans-serif" font-size="13" text-anchor="middle">BETWEEN ALGORITHMS</text>
    <text x="72" y="59" fill="#fbcfe8" font-family="'Caveat', cursive, sans-serif" font-size="13" text-anchor="middle">AND IMAGINATION</text>
    <text x="72" y="77" fill="#f472b6" font-family="'Caveat', cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">I FOUND MYSELF</text>
    <text x="72" y="96" fill="#f43f5e" font-family="sans-serif" font-size="14" text-anchor="middle">♡</text>
  </g>

  <!-- Laptop on the Desk -->
  <g transform="translate(280, 220)">
    <!-- Screen Outer Frame -->
    <rect x="50" y="20" width="220" height="145" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Screen Inner Display with cyan/blue glow -->
    <rect x="58" y="28" width="204" height="129" rx="4" fill="#090d24" />
    <!-- Stars & Orbit doodle on screen -->
    <ellipse cx="215" cy="55" rx="20" ry="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" transform="rotate(-20 215 55)" />
    <circle cx="215" cy="55" r="4" fill="#818cf8" />
    <circle cx="80" cy="45" r="1.5" fill="#38bdf8" />
    <circle cx="95" cy="115" r="1" fill="#c084fc" />
    <!-- Screen Text: "A better me is always a work in progress..." -->
    <text x="160" y="75" fill="#fbcfe8" font-family="'Caveat', cursive, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">A better me</text>
    <text x="160" y="98" fill="#e0e7ff" font-family="'Caveat', cursive, sans-serif" font-size="17" text-anchor="middle">is always</text>
    <text x="160" y="120" fill="#38bdf8" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">a work in progress...</text>
    
    <!-- Keyboard Base -->
    <polygon points="30,172 290,172 310,195 10,195" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="130" y="177" width="60" height="12" rx="3" fill="#0f172a" />
  </g>

  <!-- Stack of Books & Black Cat (Left of Laptop) -->
  <g transform="translate(130, 200)">
    <!-- Book 6 (Bottom): BIGGER DREAMS -->
    <rect x="10" y="200" width="140" height="24" rx="3" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
    <text x="80" y="216" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">BIGGER DREAMS</text>

    <!-- Book 5: GOOD BOOKS -->
    <rect x="15" y="176" width="130" height="23" rx="3" fill="#3b0764" stroke="#6b21a8" stroke-width="1" />
    <text x="80" y="192" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">GOOD BOOKS</text>

    <!-- Book 4: FANTASY -->
    <rect x="20" y="152" width="120" height="23" rx="3" fill="#172554" stroke="#1d4ed8" stroke-width="1" />
    <text x="80" y="168" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">FANTASY</text>

    <!-- Book 3: PHYSICS -->
    <rect x="25" y="128" width="110" height="23" rx="3" fill="#042f2e" stroke="#0f766e" stroke-width="1" />
    <text x="80" y="144" fill="#5eead4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">PHYSICS</text>

    <!-- Book 2: PYTHON -->
    <rect x="30" y="104" width="100" height="23" rx="3" fill="#14532d" stroke="#15803d" stroke-width="1" />
    <text x="80" y="120" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">PYTHON</text>

    <!-- Book 1 (Top): AI -->
    <rect x="38" y="80" width="84" height="23" rx="3" fill="#701a75" stroke="#a21caf" stroke-width="1" />
    <text x="80" y="96" fill="#f0abfc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">AI</text>

    <!-- Sleek Black Cat resting on top of books -->
    <!-- Cat Body -->
    <ellipse cx="80" cy="55" rx="22" ry="18" fill="#090a12" />
    <!-- Cat Head -->
    <circle cx="62" cy="40" r="14" fill="#090a12" />
    <!-- Cat Ears -->
    <polygon points="52,32 50,18 60,28" fill="#090a12" />
    <polygon points="64,28 72,18 72,32" fill="#090a12" />
    <polygon points="53,30 52,22 58,28" fill="#f472b6" opacity="0.6" />
    <!-- Glowing Green-Cyan Cat Eyes -->
    <ellipse cx="56" cy="38" rx="2.5" ry="3.5" fill="#34d399" filter="url(#glow)" />
    <ellipse cx="66" cy="38" rx="2.5" ry="3.5" fill="#34d399" filter="url(#glow)" />
    <ellipse cx="56" cy="38" rx="0.8" ry="2.5" fill="#022c22" />
    <ellipse cx="66" cy="38" rx="0.8" ry="2.5" fill="#022c22" />
    <!-- Cat Tail curling down -->
    <path d="M 98 62 Q 115 75, 110 95 Q 106 105, 96 102" fill="none" stroke="#090a12" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug: "FUELED BY COFFEE & IDEAS" -->
  <g transform="translate(235, 380)">
    <!-- Mug Body -->
    <rect x="10" y="10" width="46" height="42" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <!-- Mug Handle -->
    <path d="M 56 20 C 70 20, 70 42, 56 42" fill="none" stroke="#3f3f46" stroke-width="3.5" />
    <!-- Text on Mug -->
    <text x="33" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="bold" text-anchor="middle">FUELED</text>
    <text x="33" y="31" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="5" font-weight="bold" text-anchor="middle">BY</text>
    <text x="33" y="38" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="bold" text-anchor="middle">COFFEE</text>
    <text x="33" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="4.5" text-anchor="middle">&amp; IDEAS</text>
    <!-- Rising Steam -->
    <path d="M 24 6 Q 21 0, 27 -6" fill="none" stroke="#cbd5e1" stroke-width="1.2" opacity="0.5" stroke-linecap="round" />
    <path d="M 33 6 Q 37 0, 31 -6" fill="none" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
    <path d="M 42 6 Q 39 0, 45 -6" fill="none" stroke="#cbd5e1" stroke-width="1.2" opacity="0.5" stroke-linecap="round" />
  </g>

  <!-- Desk Surface -->
  <rect x="0" y="440" width="600" height="60" fill="#080c20" stroke="#1e293b" stroke-width="1" />
</svg>
